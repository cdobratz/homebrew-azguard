name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  brew:
    name: brew audit and test
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: Audit, install, and test
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
          # setup-homebrew trusts this tap but does not expose tap-name as an
          # action output. Use the tap formula name directly.
          FORMULA: cdobratz/azguard/azguard
        run: |
          git -C "$(brew --repo cdobratz/azguard)" log -1 --oneline
          brew style --formula "$FORMULA"
          brew audit --strict --os=all --arch=all --formula "$FORMULA"
          brew install --formula "$FORMULA"
          brew test "$FORMULA"
